name: CI
# Linux 자체 러너(jena-dabi-linux)에서만 테스트한다.

# 기준 Python 3.12 에서 전체 회귀 테스트를 돌린다.
# 테스트는 실제 사이트에 접속하지 않지만, 런타임 사전 검사의 계약을 확인하기
# 위해 Patchright Chromium 런타임을 러너 밖 캐시에 설치한다.
#
# 러너가 오프라인이면 CI는 queued 상태로 남는다. 러너 PC에서 관리한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create clean virtual environment
        run: python -m venv --clear .venv

      - name: Configure persistent pip cache
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope=pr
          else
            scope=trusted
          fi
          pip_cache="${{ runner.tool_cache }}/package-stores/${{ github.repository }}/Linux-X64/${scope}/pip"
          mkdir -p "$pip_cache"
          printf 'PIP_CACHE_DIR=%s\n' "$pip_cache" >> "$GITHUB_ENV"

      - name: Verify CI lock inputs
        run: sha256sum --check requirements-ci.inputs.sha256

      - name: Install dependencies
        run: |
          ./.venv/bin/python -m pip install --require-hashes -r requirements-ci.lock

      - name: Install Patchright Chromium runtime
        run: ./.venv/bin/patchright install chromium

      # 테스트는 실제 사이트에 접속하지 않고 페이크/스텁으로 동작한다.
      - name: Run tests
        run: ./.venv/bin/python -m pytest tests/ -q
