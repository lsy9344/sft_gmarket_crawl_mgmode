  name
  vendor {
    nid
    name
    delivery {
      ...DeliveryTagResFragment
      __typename
      ... on DirectDelivery {
        arrivalTag
      }
      ... on AggregateDelivery {
        arrivalTag
      }
    }
    id
  }
  price {
    originalPrice
    salePrice
    appliedCoupon {
      price
    }
    discountRate
    pricePerQuantity {
      __typename
    }
  }
  goodsQuantity {
    minPerOrderQuantity {
      activated
      quantity
    }
    unitQuantity
  }
  categoryNode {
    path
    id
  }
  standard
  unit
  isFreeDelivery
}

fragment SimpleGoodsListPCFragment_34JFH2 on Query {
  goodsList(first: $first, after: $after, input: $input, areaId: $areaId) {
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    edges {
      node {
        nid
        ...ItemCardResFragment_3ZwZC2
        id
        __typename
      }
      cursor
    }
  }
}

