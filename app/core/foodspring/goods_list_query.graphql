  price {
    pricePerQuantity {
      quantity
      price
    }
  }
  goodsQuantity {
    minPerOrderQuantity {
      quantity
      activated
    }
  }
  deliveryFee {
    __typename
    ... on FreeDeliveryFee {
      __typename
      id
    }
    ... on ConditionalDeliveryFee {
      __typename
      condition
      id
    }
    ... on ArrivalDeliveryFee {
      id
    }
    ... on ChunkDeliveryFee {
      id
    }
    ... on PaidDeliveryFee {
      id
    }
    ... on QuantityDeliveryFee {
      id
    }
    ... on WeightVolumeDeliveryFee {
      id
    }
  }
  categoryNode {
    path
    id
  }
}

